name: Slow smoke

# 手动触发（workflow_dispatch），不挂 push/pull_request —— 慢速测试不进 PR CI。
# 定位是**干净环境抽查**，验证三件事：
#   1) 全新 runner 上 pip install 这条链路是否还通（CLI 一律 `python -m iopaint` 调用）
#   2) `iopaint download` 权重下载链路是否还通
#   3) 真实模型能推理出图（erase 小模型 lama/fcf + 无权重的 cv2，~19 例）
#
# SD / ControlNet 这一级的慢速测试不在这里跑：GitHub-hosted runner 只有约 16GB
# 内存、纯 CPU，且没有持久权重缓存（缓存上限 10GB + 7 天过期，SD 级资产 ~20GB
# 每轮重下、10+ 分钟才能开跑）。本地 GPU 机器的跑法见 AGENTS.md 的
# "Slow tests (run locally)" 一节。
on:
  workflow_dispatch:

jobs:
  slow-smoke:
    name: slow (spot check)
    runs-on: ubuntu-latest
    # 装 torch + 下 ~1GB 小权重 + 跑 ~19 个用例，60 分钟足够
    timeout-minutes: 60
    env:
      # 权重缓存统一指到 workspace 卷（根盘更紧张）：
      #   - iopaint 模型目录 DEFAULT_MODEL_DIR（iopaint/const.py:97）
      #   - HuggingFace hub（$XDG_CACHE_HOME/huggingface）
      #   - torch.hub（erase 权重落在 hub/checkpoints，iopaint/helper.py）
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache

    steps:
      # 扩工作目录盘（OS/工具链占掉根盘大头，权重与 venv 都放 workspace 卷）。
      # 必须在 checkout 之前执行：它会重建工作目录。
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 1024
          # runner 整机约 16GB 内存，swap 给 2G 兜底
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Report disk after maximize
        run: df -h

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # site-packages 建在 workspace 卷，根盘只留 base python。必须在 checkout 之后
      # 建，否则 actions/checkout 的 `git clean -ffdx` 会清掉未跟踪的 .venv。
      - name: Create venv on build volume
        run: |
          python -m venv "$GITHUB_WORKSPACE/.venv"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # 同 ci.yml：requirements.txt 钉的 +cu121 只在 CUDA 索引上，摘掉走 CPU wheel。
      # pytest-forked 只为 --forked（用例级内存隔离，见测试步注释）。
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision)==' requirements.txt > /tmp/req-notorch.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch==2.3.1+cpu torchvision==0.18.1+cpu
          pip install -r /tmp/req-notorch.txt
          pip install pytest pytest-loguru pytest-forked

      # 只下 lama/fcf：验证 `python -m iopaint download` 链路 + 支撑
      # test_local_models 的参数化（_LOCAL_MODELS = scan_models()，cv2 无权重）。
      # 不预下载 ldm/zits/mat/manga/migan，该文件自动只测盘上有的，内存可控。
      # SD1.5 / ControlNet / 插件权重不进 CI，属本地范围（见 AGENTS.md）。
      - name: Pre-download models
        run: |
          for m in lama fcf; do
            python -m iopaint download --model "$m"
          done

      - name: Report disk after download
        if: always()
        run: |
          df -h
          du -sh "$XDG_CACHE_HOME" 2>/dev/null || true

      # 内存采样（15s）+ df，用于定位 OOM / 磁盘类问题。
      # 步骤级 timeout 让超时以优雅终止收场：runner 硬断线时日志 blob 不会上传
      # （BlobNotFound），什么都查不了。
      - name: Run slow spot check
        timeout-minutes: 45
        run: |
          ( while true; do
              printf '[%s] ' "$(date +%T)"
              free -m | awk 'NR==2{printf "mem used=%sMB avail=%sMB ", $3, $7} NR==3{printf "swap used=%sMB ", $3}'
              df -h / | awk 'NR==2{printf "root avail=%s", $4}'
              echo
              sleep 15
            done ) &

          # --forked：每个用例跑在独立 fork 子进程里（pytest_runtest_protocol 整体
          # 进子进程），退出即归还内存。runner 无 GPU，torch_gc 的
          # torch.cuda.is_available() 为 False 会跳过 cuda 分支；本机 GPU 上不能用
          # --forked（torch 会抛 Cannot re-initialize CUDA in forked subprocess）。
          pytest -v --tb=short --durations=10 --forked \
            iopaint/tests/test_local_models.py

      - name: Report disk after tests
        if: always()
        run: df -h
