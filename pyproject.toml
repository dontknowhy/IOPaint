[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# pydantic 模型字段都有默认值，不开插件时 mypy 会把 InpaintRequest()/ApiConfig() 这类
# 构造调用误报成 "Missing named argument"；插件按字段签名解析。strict flags 仍由
# scripts/check_types.py 传入，这里只负责加载插件。
[tool.mypy]
plugins = ["pydantic.mypy"]

# 上游快照只做命名空间改写和极少量适配（basicsr/facexlib/gfpgan/SAM/SAM2、HF 的
# anytext/power_paint/brushnet、briarmbg2），让它们满足 --disallow-untyped-defs 等于改上游源码：
# 全树 3777 条 mypy 报错里 1087 条只是这些文件的 no-untyped-def。它们又确实会被本地修改，
# 而 check_types 把改动行当新增行——实测给 build_sam.py 的 build_sam_vit_b 加一个参数就产生
# 1 条 no-untyped-def 新增行报错。因此按包 ignore_errors；项目自身代码仍走同一套严格 flag。
# 不能用 exclude 替代：[tool.mypy] exclude 只作用于目录发现，check_types 显式传文件路径时
# 仍会报错（实测 exclude 该目录后同一改动仍是 2 条新增行报错）。
[[tool.mypy.overrides]]
module = [
    "iopaint.plugins.basicsr",
    "iopaint.plugins.basicsr.*",
    "iopaint.plugins.facexlib",
    "iopaint.plugins.facexlib.*",
    "iopaint.plugins.gfpgan",
    "iopaint.plugins.gfpgan.*",
    "iopaint.plugins.segment_anything",
    "iopaint.plugins.segment_anything.*",
    "iopaint.plugins.segment_anything2",
    "iopaint.plugins.segment_anything2.*",
    "iopaint.plugins.briarmbg2",
    "iopaint.model.anytext",
    "iopaint.model.anytext.*",
    "iopaint.model.power_paint",
    "iopaint.model.power_paint.*",
    "iopaint.model.brushnet",
    "iopaint.model.brushnet.*",
]
ignore_errors = true

# mutmut（本地变异测试侦察用，非 CI 门禁；见 docs/agents/review-prompts.md）。
# source_paths 只复制 iopaint 包（测试、pytest.ini 随行），only_mutate 把变异限制在单个文件，
# -m "not slow" 保证权重/GPU 用例不进基线。only_mutate 必须选"未被装饰器包住的函数所在的
# 文件"：mutmut 3.8 跳过一切带装饰器的函数（file_mutation.py 的 FunctionDef 分支），schema.py
# 因此产出 0 个可用变异体，helper.py 的裸函数则能正常生成。
# 不需要 deselect 任何用例：test_runtime_gaps 的 reload 污染已由该文件的
# _restore_runtime_module fixture 在每个测试结束时把 iopaint.runtime 的 module dict
# 还原成进测试时的快照修复，mutmut 按 set 顺序乱序跑子集同样安全。
[tool.mutmut]
source_paths = ["iopaint"]
only_mutate = ["iopaint/helper.py"]
pytest_add_cli_args = [
    "-m",
    "not slow",
]
pytest_add_cli_args_test_selection = [
    "-m",
    "not slow",
    "--ignore=iopaint/tests/test_webui.py",
]
