name: iopaint
channels:
  - pytorch
  - nvidia
  - defaults
  - nodefaults
dependencies:
  - python=3.12
  - pip
  # Core PyTorch：torch 2.14.1 没有 conda 构建（pytorch channel 里搜不到），只能走 pip。
  # +cu126 这个 local version 只在 CUDA 索引上有；它 pin 的 cuDNN 9.10.2.21 是最后一个还支持
  # Pascal / SM<7.5 的 cuDNN（PyPI 上默认轮子是 cu13 + cuDNN 9.24，Pascal 上跑不了）。
  - pip:
    - --extra-index-url https://mirrors.aliyun.com/pytorch-wheels/cu126
    - torch==2.14.1+cu126
    - torchvision==0.29.1+cu126
    # pip dependencies (from requirements.txt + extras)
    - opencv-python
    - diffusers==0.34.0
    - huggingface_hub==0.36.2
    - accelerate
    - peft==0.20.0
    - transformers>=4.41.2,<5
    - safetensors>=0.8.0
    - controlnet-aux==0.0.10
    - fastapi>=0.115.2,<1.0
    - uvicorn
    - python-multipart
    - python-socketio==5.16.4
    - typer>=0.12,<0.28
    - pydantic>=2.5.2
    - rich
    - loguru
    - yacs
    - piexif==1.1.3
    - omegaconf
    - easydict
    - gradio==5.50.0
    - typer-config==1.4.0
    - Pillow>=10.0.0
    # Dev tools（和 requirements-dev.txt 是同一份，见根目录 requirements-dev.txt）
    - pytest
    - pytest-loguru
    - mypy==2.4.0
    - mutmut==3.8.0
