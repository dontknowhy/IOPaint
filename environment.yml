name: iopaint
channels:
  - pytorch
  - nvidia
  - defaults
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - # Core PyTorch (CUDA 12.1)
  - pytorch::torch=2.3.1=py3.12_cuda12.1_cudnn8.9.2_0
  - pytorch::torchvision=0.18.1=py3.12_cuda12.1_cudnn8.9.2_0
  - # pip dependencies (from requirements.txt + extras)
  - pip:
    - opencv-python
    - diffusers==0.34.0
    - huggingface_hub==0.36.2
    - accelerate
    - peft==0.20.0
    - transformers>=4.41.2,<5
    - safetensors>=0.8.0
    - controlnet-aux==0.0.10
    - fastapi>=0.115.2,<1.0
    - uvicorn
    - python-multipart
    - python-socketio==5.16.4
    - typer>=0.12,<0.28
    - pydantic>=2.5.2
    - rich
    - loguru
    - yacs
    - piexif==1.1.3
    - omegaconf
    - easydict
    - gradio==5.50.0
    - typer-config==1.4.0
    - Pillow>=10.0.0
    - # Dev tools
    - ruff
    - pytest
    - pytest-loguru
